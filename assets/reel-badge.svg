<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="160" height="160">
  <defs>
    <path id="textCircle" d="M 100, 100 m -75, 0 a 75,75 0 1,1 150,0 a 75,75 0 1,1 -150,0" fill="none" />
    <radialGradient id="neuralCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer dashed orbital track -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1.2" stroke-dasharray="4 4" />
  
  <!-- Middle subtle reference ring -->
  <circle cx="100" cy="100" r="54" fill="none" stroke="rgba(100,255,218,0.2)" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Circular typography -->
  <text font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.8" fill="#e2e8f0">
    <textPath href="#textCircle" startOffset="0%">
      SASMITHA NIMESH • NEURAL CORE &amp; AI BURST •
    </textPath>
  </text>

  <!-- Central Singularity Core -->
  <circle cx="100" cy="100" r="35" fill="url(#neuralCoreGlow)" stroke="#38bdf8" stroke-width="1.8" />
  <circle cx="100" cy="100" r="28" fill="none" stroke="rgba(100,255,218,0.3)" stroke-width="1" stroke-dasharray="3 3" />
  
  <!-- Neural Synaptic Lattice Connections -->
  <g stroke="#38bdf8" stroke-width="1.4" opacity="0.85">
    <line x1="100" y1="100" x2="100" y2="78" />
    <line x1="100" y1="100" x2="119" y2="89" />
    <line x1="100" y1="100" x2="119" y2="111" />
    <line x1="100" y1="100" x2="100" y2="122" />
    <line x1="100" y1="100" x2="81" y2="111" />
    <line x1="100" y1="100" x2="81" y2="89" />
    
    <!-- Outer cross-synaptic links -->
    <line x1="100" y1="78" x2="119" y2="89" stroke="rgba(100,255,218,0.5)" stroke-width="1" />
    <line x1="119" y1="89" x2="119" y2="111" stroke="rgba(100,255,218,0.5)" stroke-width="1" />
    <line x1="119" y1="111" x2="100" y2="122" stroke="rgba(100,255,218,0.5)" stroke-width="1" />
    <line x1="100" y1="122" x2="81" y2="111" stroke="rgba(100,255,218,0.5)" stroke-width="1" />
    <line x1="81" y1="111" x2="81" y2="89" stroke="rgba(100,255,218,0.5)" stroke-width="1" />
    <line x1="81" y1="89" x2="100" y2="78" stroke="rgba(100,255,218,0.5)" stroke-width="1" />
  </g>

  <!-- Peripheral Neural Nodes -->
  <circle cx="100" cy="78" r="2.8" fill="#64ffda" />
  <circle cx="119" cy="89" r="2.8" fill="#38bdf8" />
  <circle cx="119" cy="111" r="2.8" fill="#64ffda" />
  <circle cx="100" cy="122" r="2.8" fill="#38bdf8" />
  <circle cx="81" cy="111" r="2.8" fill="#64ffda" />
  <circle cx="81" cy="89" r="2.8" fill="#38bdf8" />

  <!-- Central AI Singularity Star / Nucleus -->
  <path d="M 100 88 Q 100 100 112 100 Q 100 100 100 112 Q 100 100 88 100 Q 100 100 100 88 Z" fill="#ffffff" filter="url(#coreGlow)" />
  <circle cx="100" cy="100" r="3.2" fill="#64ffda" />
</svg>
